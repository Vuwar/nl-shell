# Versions and releases, worked out from commit messages.
#
# Nothing here fires on a tag. release-please watches main, and for every
# release-worthy commit it keeps a pull request open — "chore(main): release
# 0.2.0" — carrying the version bump and the changelog entry for everything
# merged since the last release. Nothing is built or published while that PR
# sits there. Merging it is the act of releasing:
#
#   merge the release PR
#     -> release-please tags it and drafts a GitHub release with the changelog
#     -> build.yml builds all four targets plus the wheel
#     -> the installers are attached to that draft
#     -> you press publish
#
# How the number is decided, from the commit subjects since the last release:
#
#   fix: ...                       patch    0.1.0 -> 0.1.1
#   feat: ...                      minor    0.1.0 -> 0.2.0
#   feat!: ...  / BREAKING CHANGE: minor    0.1.0 -> 0.2.0   (see below)
#   docs:, chore:, refactor:, ...  nothing
#
# Below 1.0 a breaking change bumps the minor rather than the major, which is
# the usual reading of semver for a 0.x project and what bump-minor-pre-major
# in release-please-config.json asks for. Reaching 1.0 is a deliberate act:
# put `Release-As: 1.0.0` in a commit body when you mean it.
#
# Building happens in this workflow rather than in one triggered by the new
# tag, and that isn't a style choice: a tag pushed by GITHUB_TOKEN doesn't
# trigger other workflows, by design, so a separate tag-triggered build would
# simply never run.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag, the draft release and the release branch
      pull-requests: write # to open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Only on the run that merged a release PR. Every other push to main gets
  # built by ci.yml instead, which is the same build with a throwaway version.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
      retention-days: 90

  attach:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload the assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      # gh rather than a third-party action: it's already on the runner, and
      # --clobber means re-running this after fixing one platform's build
      # replaces that file instead of failing on one that's already there.
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber

      - name: Say where it went
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "### $TAG is drafted"
            echo ""
            echo "The installers are attached. It stays a draft until you publish it:"
            echo ""
            echo "<https://github.com/${{ github.repository }}/releases>"
          } >> "$GITHUB_STEP_SUMMARY"
