# Builds the app, and releases it when there's a release to cut. One file,
# because "build it" and "release it" are the same pipeline with one extra step
# on the end — splitting them meant every push to main ran two workflows, and
# each needed a rule for skipping the other one's commits.
#
# Every push to main and every pull request builds all four desktop targets and
# the wheel, and runs the tests on Windows, macOS and Linux. Those builds are
# artifacts on the run, kept for two weeks, and nothing is published.
#
# Releasing is separate from tagging, and nothing here fires on a tag.
# release-please watches main, and for every release-worthy commit keeps a pull
# request open — "chore(main): release 0.2.0" — carrying the version bump and
# the changelog for everything merged since the last release. Merging that PR
# is the act of releasing:
#
#   merge the release PR
#     -> release-please tags it and drafts a GitHub release with the changelog
#     -> the same build below runs, with the real version number
#     -> the installers are attached to that draft
#     -> you press publish
#
# How the number is decided, from the commit subjects since the last release:
#
#   fix: ...                       patch    0.1.0 -> 0.1.1
#   feat: ...                      minor    0.1.0 -> 0.2.0
#   feat!: ...  / BREAKING CHANGE: minor    0.1.0 -> 0.2.0   (see below)
#   docs:, chore:, refactor:, ...  nothing
#
# Below 1.0 a breaking change bumps the minor rather than the major, which is
# the usual reading of semver for a 0.x project and what bump-minor-pre-major
# in release-please-config.json asks for. Reaching 1.0 is a deliberate act:
# put `Release-As: 1.0.0` in a commit body when you mean it.
#
# The build has to happen in this workflow rather than in one triggered by the
# new tag, and that isn't a style choice: a tag pushed by GITHUB_TOKEN doesn't
# trigger other workflows, by design, so a tag-triggered build would never run.
#
# Everything it makes:
#
#   AI-Shell-<v>-windows-x64-setup.exe   installer, no administrator needed
#   AI-Shell-<v>-windows-x64.zip         the same app as a folder
#   AI-Shell-<v>-macos-arm64.zip         Apple Silicon
#   AI-Shell-<v>-macos-x64.zip           Intel
#   ai-shell-<v>-linux-x64.tar.gz        needs WebKit2GTK on the machine
#   nl_shell-<v>-py3-none-any.whl        the pip route
#   nl_shell-<v>.tar.gz                  sdist
#
# None of the desktop builds contain llama.cpp or a model. Those are fetched
# into the user's own config folder on first run (see ai_shell/runtime.py),
# which is what keeps a download in the tens of megabytes rather than the
# thousands — and what lets an app update leave several gigabytes of
# already-downloaded weights alone.

name: Build and release

on:
  push:
    branches: [main]
    # Tags don't build anything on their own; releases come from merging the
    # release PR, and that push to main is what runs this.
    tags-ignore: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # A newer push to a pull request makes the older run's artifacts pointless.
  # A run on main might be attaching installers to a release, and killing that
  # halfway would leave a release with some of its files.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Keeps the release PR up to date, and on the run that merges it, tags and
  # drafts the release. Does nothing on a pull request — the jobs below cope
  # with it being skipped.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag, the draft release and the release branch
      pull-requests: write # to open and update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The version number is worked out from commit subjects, so a subject that
  # doesn't parse is a commit that silently counts for nothing — no bump, no
  # changelog line. Checking the PR title is what catches that, because a
  # squash merge is what turns the title into the commit subject.
  #
  # This fails rather than merely warning, so it's visible, but a failing check
  # blocks nothing unless you add it to branch protection. Fixing it is editing
  # the PR title.
  commit-convention:
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the PR title is a conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|docs|refactor|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "OK: $TITLE"
            exit 0
          fi
          echo "::error title=PR title isn't a conventional commit::$TITLE"
          cat <<'HELP'

          The version number and the changelog are generated from commit
          subjects, and this one won't parse — merged as is, it would bump
          nothing and appear nowhere in the release notes.

            fix: window opens off-screen with two monitors     -> 0.1.0 to 0.1.1
            feat: settings screen can pick the model           -> 0.1.0 to 0.2.0
            feat!: drop Python 3.10                            -> 0.1.0 to 0.2.0
            docs: explain the Linux WebKit packages            -> no release

          Types: feat, fix, perf, docs, refactor, test, build, ci, chore, revert
          A scope is optional: fix(gui): ...

          HELP
          exit 1

  desktop:
    needs: release-please
    # release-please is skipped on pull requests, and a job whose dependency
    # was skipped is skipped too unless it says otherwise. !cancelled() is what
    # says otherwise; the rest is "don't build if release-please actually
    # failed", and "don't build the release PR" — it holds a version number and
    # a changelog, no code, and GitHub makes runs on a bot-authored PR wait for
    # a human to approve them.
    if: ${{ !cancelled() && needs.release-please.result != 'failure' && !startsWith(github.head_ref || '', 'release-please--') }}
    strategy:
      fail-fast: false # one platform's problem shouldn't hide another's
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15 # Apple Silicon
            target: macos-arm64
          - os: macos-15-intel # free on public repos; the -large ones are not
            target: macos-x64
          - os: ubuntu-22.04 # oldest still-supported image: binaries built
            target: linux-x64 # against a newer glibc won't run on older distros
    runs-on: ${{ matrix.os }}
    # A retired runner label doesn't fail — the job queues for a runner that
    # will never come, and the default gives it six hours to not come. This is
    # how macos-13 announced its retirement, and thirty minutes is far more
    # than any of these builds has ever needed.
    timeout-minutes: 30
    env:
      # The real version when this run is releasing one; otherwise a throwaway
      # that only has to tell one run's artifacts from another's. Numeric
      # because the Windows installer's version resource can't be anything else.
      AI_SHELL_VERSION: ${{ needs.release-please.outputs.version || format('0.0.{0}', github.run_number) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_shell_gui/frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # WebKit and GTK, which pip can't install — the same packages the README
      # tells a Linux user to install before running from source. The -dev ones
      # are only needed to build PyGObject against them.
      - name: Install GTK/WebKit (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgirepository1.0-dev libcairo2-dev pkg-config python3-dev \
            gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Through pywebview's own extra rather than by naming a version: it pins
      # PyGObject to the release its GTK backend is written against, which is
      # also safely below the 3.52 that switched to girepository-2.0 and won't
      # build against the introspection libraries in 22.04.
      - name: Install PyGObject (Linux)
        if: runner.os == 'Linux'
        run: pip install "pywebview[gtk]"

      # Before building rather than in a job of its own: it gives the suite a
      # run on all three platforms for free, and a build that fails its tests
      # shouldn't get as far as producing installers.
      - name: Run tests
        run: python -m unittest discover -t . -s tests

      - name: Build the front end
        working-directory: ai_shell_gui/frontend
        run: |
          npm ci
          npm run build

      - name: Build the app
        run: pyinstaller --noconfirm packaging/ai-shell.spec

      # An unsigned bundle won't launch at all on Apple Silicon, and an ad-hoc
      # signature is enough to get past that. It is NOT notarization: a user who
      # downloads this still meets Gatekeeper's "unidentified developer", and
      # the README says which two clicks get past it. Real notarization needs a
      # paid Apple Developer account.
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - "dist/AI Shell.app"

      # ditto rather than zip: it's the only one that reliably preserves the
      # symlinks and the executable bits inside a .app.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/AI Shell.app" "AI-Shell-${AI_SHELL_VERSION}-${{ matrix.target }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf "ai-shell-${AI_SHELL_VERSION}-linux-x64.tar.gz" -C dist ai-shell

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner image ships Inno Setup, but not a pinned version, and the
          # script uses directives from 6.3. Installing makes the build
          # reproducible instead of dependent on this month's image.
          choco install innosetup -y --no-progress
          # Windows' own version resource has to be four numbers and nothing
          # else, so a version like 0.2.0-rc1 keeps its name everywhere the user
          # sees it and loses the suffix only in that field.
          $numeric = ($env:AI_SHELL_VERSION -split '[-+]')[0]
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:AI_SHELL_VERSION" "/DVersionInfo=$numeric" `
                  "/DDistDir=$PWD\dist\AI Shell" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }
          Move-Item "dist\installer\*.exe" .
          Compress-Archive -Path "dist\AI Shell" -DestinationPath "AI-Shell-$env:AI_SHELL_VERSION-windows-x64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          retention-days: ${{ needs.release-please.outputs.release_created == 'true' && 90 || 14 }}
          path: |
            *.zip
            *.tar.gz
            *.exe
          if-no-files-found: error

  # The pip route. One job, not four: the wheel is pure Python and works
  # everywhere — but it still has to be built on a machine with npm, because
  # the React app it carries is a build product that isn't in the repository.
  python-package:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result != 'failure' && !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ai_shell_gui/frontend/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the front end
        working-directory: ai_shell_gui/frontend
        run: |
          npm ci
          npm run build

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # A wheel that installs but whose window can't draw is the exact failure
      # this is worth catching, and it costs one job step: install into a clean
      # environment and check the front end came along.
      - name: Check the wheel carries the front end
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --quiet dist/*.whl
          /tmp/check/bin/python - <<'PY'
          import os
          import ai_shell
          import ai_shell_gui.app as gui
          from ai_shell_cli.app import run  # the console entry point must resolve

          assert os.path.exists(gui.HTML_PATH), f"front end missing from the wheel: {gui.HTML_PATH}"
          print(f"nl-shell {ai_shell.__version__} installs clean, front end present")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          retention-days: ${{ needs.release-please.outputs.release_created == 'true' && 90 || 14 }}
          path: dist/*
          if-no-files-found: error

  # Only on the run that merged a release PR. Every other run stops above, with
  # its builds sitting on the run as artifacts.
  attach:
    needs: [release-please, desktop, python-package]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload the assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      # gh rather than a third-party action: it's already on the runner, and
      # --clobber means re-running this after fixing one platform's build
      # replaces that file instead of failing on one that's already there.
      - name: Attach the builds to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" artifacts/* --clobber

      - name: Say where it went
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          {
            echo "### $TAG is drafted"
            echo ""
            echo "The installers are attached. It stays a draft until you publish it:"
            echo ""
            echo "<https://github.com/${{ github.repository }}/releases>"
          } >> "$GITHUB_STEP_SUMMARY"
